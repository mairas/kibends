# Builds the wheels and the sdist, installs each in a fresh environment, and
# runs the CLI from it; the wheels also run the baseline tests, so the build
# users install computes what the dev build does. pr.yml calls it on every
# pull request, and release.yml before publishing.
name: Build wheels

on:
  workflow_call:

permissions:
  contents: read

# Run steps with -eo pipefail rather than the implicit bash -e.
defaults:
  run:
    shell: bash

env:
  # The oldest CPython the abi3 wheels support, from requires-python.
  PYTHON_VERSION: '3.14'

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: '2_28' }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: '2_28' }
          - { runner: macos-latest, target: aarch64, manylinux: '' }
          - { runner: windows-latest, target: x64, manylinux: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - name: Run the installed CLI
        id: cli
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected one wheel, found ${#wheels[@]}"
            exit 1
          fi
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"
          uv run --isolated --no-project --no-config --python "$PYTHON_VERSION" --with "${wheels[0]}" \
            kibends --help

      # The checkout's src/ is not on the path, so the tests import the wheel.
      - name: Run the baseline tests against the wheel
        env:
          WHEEL: ${{ steps.cli.outputs.wheel }}
          OPENBLAS_NUM_THREADS: '1'
        run: |
          uv run --isolated --no-project --no-config --python "$PYTHON_VERSION" --with "$WHEEL" \
            --with 'pytest>=8.3.4' --with 'pytest-xdist>=3.8.0' \
            python -m pytest -p no:cacheprovider tests/test_scipy_baseline.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      # Builds the extension from the sdist, as an install on a platform
      # without a wheel does. --no-config keeps the checkout's [tool.uv],
      # whose unisolated dev-profile build is for ./run sync, out of it.
      - name: Run the CLI installed from the sdist
        run: |
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected one sdist, found ${#sdists[@]}"
            exit 1
          fi
          uv run --isolated --no-project --no-config --python "$PYTHON_VERSION" --with "${sdists[0]}" \
            kibends --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
