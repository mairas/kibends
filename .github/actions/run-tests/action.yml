name: Run tests
description: Lint, type-check and test kibends

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Install dependencies
      shell: bash
      run: ./run sync

    - name: Lint
      shell: bash
      run: ./run lint

    - name: Type-check
      shell: bash
      run: ./run typecheck

    - name: Test
      shell: bash
      run: ./run test-all
