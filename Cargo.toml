[workspace]
members = ["rust/core", "rust/py"]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["Matti Airas <matti.airas@hatlabs.fi>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/mairas/kibends"
publish = false

[workspace.dependencies]
kibends-core = { path = "rust/core" }
pyo3 = "0.30.1"
pyo3-stub-gen = "0.23.2"

# The editable build and `cargo test` share the dev profile, so the tests
# run optimized code and an edit rebuilds only the crate it touches.
[profile.dev.package.kibends-core]
opt-level = 2

# The binding converts every array element crossing to Python.
[profile.dev.package.kibends-py]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
