[project]
name = "kibends"
version = "0.0.1"
authors = [{ name = "Matti Airas", email = "matti.airas@hatlabs.fi" }]
description = "Smooth KiCad tracks into short, clearance-keeping paths"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["KiCad", "EDA", "PCB", "tracks", "rounding"]
dependencies = [
    "kicad-python >= 0.8.0",
    "loguru>=0.7.3",
    "numpy>=2.4.6",
    "shapely>=2.2.0",
]

[project.scripts]
kibends = "kibends.cli:main"

[project.urls]
Homepage = "https://github.com/mairas/kibends"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "maturin>=1.9.4,<2",
    "pytest>=8.3.4",
    "types-protobuf>=7.35.1.20260906",
    "types-shapely>=2.1.0.20261030",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "pyright>=1.1.414",
]

[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "kibends._core"
manifest-path = "rust/py/Cargo.toml"
# The dev profile, as `cargo test` uses, so an edit rebuilds only its crate.
profile = "dev"

[tool.uv]
# Built with the project's own Python, whose path stays put, rather than a
# fresh build environment's, so pyo3 is not rebuilt on every sync.
no-build-isolation-package = ["kibends"]
# uv rebuilds the extension only when one of these changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust/**/Cargo.toml" },
    { file = "rust/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The baseline test runs its cases as scripts/record_baseline.py recorded them.
pythonpath = ["scripts"]
# Parallel by default; pass `-n 0` to run serially (e.g. for pdb).
addopts = "-n auto"
markers = [
    "slow: takes several seconds; deselect with -m 'not slow'",
    "fallback: reaches the fallback that moves a whole burst back on purpose",
]

[tool.ruff]
target-version = "py314"
line-length = 88
# Generated by pyo3-stub-gen (`./run stubs`).
extend-exclude = ["src/kibends/_core"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# plot_scenarios.py puts tests/ on sys.path; a custom environment also
# loses pyright's automatic src root.
executionEnvironments = [
    { root = "scripts", extraPaths = ["src", "tests"] },
    { root = "tests", extraPaths = ["src", "scripts"] },
]
